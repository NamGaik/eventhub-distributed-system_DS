apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      enableServiceLinks: false   # stops Kubernetes adding extra *_PORT variables
      containers:
        - name: registration-service
          image: eventhub/registration-service:v1
          imagePullPolicy: Never  # use the image loaded into Minikube
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: MONGO_URL
              value: "mongodb://mongo:27017"
            - name: EVENT_SERVICE_URL
              value: "http://event-service:4001"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4003"
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  selector:
    app: registration-service
  ports:
    - port: 4002
      targetPort: 4002
