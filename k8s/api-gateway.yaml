apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false   # stops Kubernetes adding extra *_PORT variables
      containers:
        - name: api-gateway
          image: eventhub/api-gateway:v1
          imagePullPolicy: Never  # use the image loaded into Minikube
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: EVENT_SERVICE_URL
              value: "http://event-service:4001"
            - name: REGISTRATION_SERVICE_URL
              value: "http://registration-service:4002"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4003"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
